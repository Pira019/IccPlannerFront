name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      # 1️⃣ Checkout du repo
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # 2️⃣ Charger les variables de .env.developpement
      - name: Load .env.development
        run: |
          echo "Loading .env.development"
          export $(grep -v '^#' .env.developpement | xargs)
      
      # 3️⃣ Installer les dépendances (si nécessaire)
      - name: Install Dependencies
        run: |
          npm ci

      # 4️⃣ Build et déploiement
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_MUSHROOM_0C9B10810 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Pour les intégrations GitHub (ex: commentaires PR)
          action: "upload"
          ###### Config app/Api ######
          app_location: "/"            # Chemin du code source
          api_location: ""             # Chemin API (optionnel)
          output_location: "dist"      # Répertoire du build
          ###### Fin Config ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_MUSHROOM_0C9B10810 }}
          action: "close"

